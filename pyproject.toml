[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sautiform-africa"
version = "0.2.0"
description = "Code-switching voice assistant for accurate public-service form completion"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{name = "Buriro Chimodoi Ezekia"}]
dependencies = [
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
demo = ["streamlit>=1.37,<2"]
whisper = ["openai-whisper>=20231117"]
mms = [
  "transformers>=4.44,<5",
  "torch>=2.2",
  "soundfile>=0.12",
]
omni = ["omnilingual-asr==0.2.0"]
all-models = [
  "openai-whisper>=20231117",
  "transformers>=4.44,<5",
  "torch>=2.2",
  "soundfile>=0.12",
  "omnilingual-asr==0.2.0",
]

[project.scripts]
sautiform = "sautiform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
